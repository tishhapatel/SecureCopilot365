name: SecureCopilot 365 CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    env:
      TEST_MODE: "true"
      DATABASE_URL: "sqlite:///:memory:"
      APP_SECRET_KEY: "supersecretkeyatleast32characterslongforsecurity"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'apps/backend/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/backend/requirements.txt
          pip install pytest-cov

      - name: Run Pytest with Coverage
        run: |
          python -m pytest --cov=apps/backend --cov-report=xml --cov-report=term-missing

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'apps/frontend/package-lock.json'

      - name: Install Dependencies
        run: |
          cd apps/frontend
          npm ci

      - name: Build Application
        run: |
          cd apps/frontend
          npm run build

  teams-bot-build:
    name: Teams Bot Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'apps/teams-bot/package-lock.json'

      - name: Install Dependencies
        run: |
          cd apps/teams-bot
          npm ci

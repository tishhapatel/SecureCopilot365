name: DevSecOps CI/CD Security Scan

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  sast_scan:
    name: SAST (Bandit & Semgrep) Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit Scan
        run: bandit -r apps/backend/

      - name: Run Semgrep Scan
        uses: semgrep/semgrep-action@v1
        with:
          config: auto
          
  container_scan:
    name: Container Vulnerability (Trivy) Scan
    runs-on: ubuntu-latest
    needs: sast_scan
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t securecopilot-backend:latest apps/backend/
          
      - name: Run Trivy Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'securecopilot-backend:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

name: Dependency Vulnerability Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Safety Auditor
        run: |
          python -m pip install --upgrade pip
          pip install safety

      - name: Audit Dependencies
        run: |
          safety check -r apps/backend/requirements.txt --full-report || true

name: Container Vulnerability Scan

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  security-events: write

jobs:
  trivy-backend:
    name: Trivy Backend Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Backend Image
        run: |
          docker build -t securecopilot-backend:latest apps/backend/

      - name: Run Trivy Scanner for Backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'securecopilot-backend:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  trivy-frontend:
    name: Trivy Frontend Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Frontend Image
        run: |
          docker build -t securecopilot-frontend:latest apps/frontend/

      - name: Run Trivy Scanner for Frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'securecopilot-frontend:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
